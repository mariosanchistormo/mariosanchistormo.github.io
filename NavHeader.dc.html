<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<nav style="position:fixed; top:0; left:0; right:0; z-index:100; background:#1e1e1c; border-bottom:1px solid rgba(110,136,152,0.35); display:flex; align-items:center; justify-content:space-between; padding:0 clamp(16px,3vw,32px); height:52px; font-family:'Fira Code', monospace;">
  <a href="index.dc.html" style="color:#6e8898; text-decoration:none; font-size:11px; letter-spacing:0.06em; text-transform:uppercase; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">Mario Sanchis Tormo — Portfolio</a>
  <div style="display:flex; align-items:center; gap:clamp(14px,2.5vw,32px); flex-wrap:wrap;">
    <a href="index.dc.html" style="{{ navLinkStyle_inicio }}">Inicio</a>
    <a href="producto.dc.html" style="{{ navLinkStyle_producto }}">Producto</a>
    <a href="grafico.dc.html" style="{{ navLinkStyle_grafico }}">Gráfico</a>
    <a href="index.dc.html#contacto" style="{{ navLinkStyle_contacto }}">Contacto</a>
  </div>
</nav>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:900,&quot;height&quot;:52},&quot;activePage&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;inicio&quot;,&quot;options&quot;:[&quot;inicio&quot;,&quot;producto&quot;,&quot;grafico&quot;,&quot;contacto&quot;],&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  linkStyle(id) {
    const active = this.props.activePage === id;
    return {
      color: active ? '#00f0f0' : '#fefbea',
      textDecoration: 'none',
      fontSize: '11px',
      letterSpacing: '0.08em',
      textTransform: 'uppercase',
      fontWeight: active ? 700 : 400,
      borderBottomStyle: 'solid',
      borderBottomWidth: '1px',
      borderBottomColor: active ? '#00f0f0' : 'transparent',
      paddingBottom: '2px'
    };
  }
  renderVals() {
    return {
      navLinkStyle_inicio: this.linkStyle('inicio'),
      navLinkStyle_producto: this.linkStyle('producto'),
      navLinkStyle_grafico: this.linkStyle('grafico'),
      navLinkStyle_contacto: this.linkStyle('contacto')
    };
  }
}
</script>
</body>
</html>
